media: public/artworks-media
content:
  - name: artworks
    label: Artworks
    type: collection
    path: src/artworks
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: image
        label: Image
        type: image
        required: true
      - name: body
        label: Description
        type: rich-text
      - name: Date
        label: Date
        type: date